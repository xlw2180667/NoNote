  <path d="M29,30 Q50,25 71,30" stroke="#C79E52" stroke-width="1.2" fill="none" opacity="0.45"/>
  <path d="M32,23 Q50,19 68,23" stroke="#C79E52" stroke-width="1" fill="none" opacity="0.35"/>
  <!-- Ribbon band -->
  <path d="M27,44 Q50,38 73,44 L73,50 Q50,44 27,50 Z" fill="#7FC4E0"/>
  <path d="M27,45 Q50,39 73,45 L73,47 Q50,41 27,47 Z" fill="white" opacity="0.25"/>
  <!-- Ribbon knot -->
