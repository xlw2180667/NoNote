<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 62">
  <defs>
    <linearGradient id="brimGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3D89A"/>
      <stop offset="100%" stop-color="#D9B061"/>
    </linearGradient>
    <linearGradient id="crownGrad" x1="0.3" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#F7E2AE"/>
      <stop offset="100%" stop-color="#E0BC72"/>
    </linearGradient>
  </defs>
  <!-- Brim -->
  <ellipse cx="50" cy="46" rx="46" ry="14" fill="url(#brimGrad)"/>
  <ellipse cx="50" cy="44" rx="46" ry="13" fill="#FAE6BA" opacity="0.45"/>
  <!-- Crown -->
  <path d="M28,46 Q28,16 50,16 Q72,16 72,46 Z" fill="url(#crownGrad)"/>
